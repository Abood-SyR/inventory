<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التطبيق | طلباتي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505; /* أسود أعمق لإبراز التوهج */
            color: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden; 
        }

        /* 1. الشبكة المتحركة المضيئة */
        .animated-grid {
            position: fixed;
            inset: -50%; /* تكبير الحجم للسماح بالحركة دون ظهور حواف */
            z-index: -2;
            background-size: 40px 40px;
            /* خطوط بلون أزرق سماوي خافت */
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.12) 1px, transparent 1px);
            /* قناع التلاشي */
            mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 70%);
            /* حركة عشوائية بطيئة */
            animation: randomMove 25s ease-in-out infinite;
        }

        /* 2. توهج في المنتصف لإبراز الزر */
        .center-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            filter: blur(30px);
        }

        /* حركة عشوائية تنتقل بين الاتجاهات */
        @keyframes randomMove {
            0% { background-position: 0px 0px; }
            20% { background-position: -40px 20px; }
            40% { background-position: 30px -40px; }
            60% { background-position: -20px -20px; }
            80% { background-position: 20px 30px; }
            100% { background-position: 0px 0px; }
        }

        /* زر تحميل بسيط وحاد */
        .download-btn {
            background-color: #ffffff;
            color: #050505;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 rgba(255, 255, 255, 0); /* استعداد للتوهج */
        }

        .download-btn:hover {
            background-color: #e4e4e7;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); /* توهج خفيف عند التمرير */
        }

        /* أيقونات التواصل */
        .social-icon {
            color: #71717a;
            transition: color 0.2s ease;
        }

        .social-icon:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- عناصر الخلفية -->
    <div class="animated-grid"></div>
    <div class="center-glow"></div>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 relative z-10">
        
        <!-- أيقونة التطبيق -->
        <img src="zubaida-beauty.png" alt="أيقونة التطبيق" class="w-24 h-24 rounded-2xl mb-6 border border-zinc-800 object-cover shadow-2xl bg-zinc-900">

        <!-- اسم التطبيق -->
        <h1 class="text-2xl font-bold mb-1">طلباتي</h1>
        
        <!-- رقم الإصدار -->
        <p class="text-sm text-zinc-500 font-medium mb-8">الإصدار 1.9.3</p>

        <!-- زر التحميل -->
        <a href="https://huggingface.co/spaces/resonta/inventory_download/resolve/main/app.apk" 
           rel="noreferrer"
           class="download-btn flex items-center justify-center gap-3 px-10 py-4 rounded-md font-bold text-lg w-full max-w-xs sm:w-auto">
            <i class="fab fa-android text-xl"></i>
            تحميل التطبيق
        </a>

    </main>

    <!-- التذييل (الأسفل) -->
    <footer class="w-full py-8 px-6 flex flex-col items-center gap-6 relative z-10">
        
        <!-- أيقونات التواصل -->
        <div class="flex gap-6">
            <a href="https://wa.me/+963981082693" class="social-icon text-2xl" title="واتساب">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://www.instagram.com/abdullrahman.abdulah" class="social-icon text-2xl" title="إنستغرام">
                <i class="fab fa-instagram"></i>
            </a>
        </div>

        <!-- الحقوق -->
        <p class="text-xs text-zinc-600 font-semibold tracking-wide uppercase">
            POWERED BY ABDULLRAHMAN ABDULLAH
        </p>

    </footer>

</body>
</html>
