<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التطبيق</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0a;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ================= خلفية الشبكة المتوهجة ================= */
        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background:
                radial-gradient(circle at 20% 30%, rgba(100, 100, 255, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 255, 0.1) 0%, transparent 35%),
                radial-gradient(circle at 40% 80%, rgba(100, 255, 255, 0.1) 0%, transparent 40%),
                #0a0a0a;
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .bg-animated::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 20px);
            animation: moveGrid 30s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(30px) translateY(30px); }
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            animation: particleFloat 15s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }

        /* ================= زر التحميل ================= */
        .download-btn {
            background-color: #ffffff;
            color: #050505;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }

        .download-btn:hover {
            background-color: #e4e4e7;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* ================= أيقونات التواصل ================= */
        .social-icon {
            color: #71717a;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .social-icon:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* ================= الحالات ================= */
        .state-hidden { display: none !important; }

        .spinner {
            width: 45px; height: 45px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* شارة الحجم */
        .size-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 28px;
        }
    </style>
</head>
<body>

    <!-- ================= عناصر الخلفية ================= -->
    <div class="bg-animated"></div>
    <div id="particles"></div>

    <!-- ================= المحتوى الرئيسي ================= -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 relative z-10">

        <!-- حالة التحميل -->
        <div id="loadingState" class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
        </div>

        <!-- حالة الخطأ -->
        <div id="errorState" class="state-hidden flex flex-col items-center">
            <i class="fas fa-triangle-exclamation text-4xl text-yellow-500 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">التطبيق غير موجود</h1>
            <p id="errorMessage" class="text-sm text-zinc-500">تأكد من الرابط أو تواصل معنا</p>
        </div>

        <!-- حالة التطبيق -->
        <div id="appState" class="state-hidden flex flex-col items-center">

            <!-- أيقونة التطبيق -->
            <img id="appIcon"
                 src=""
                 alt="أيقونة التطبيق"
                 class="w-24 h-24 rounded-2xl mb-6 border border-zinc-800 object-cover shadow-2xl bg-zinc-900">

            <!-- اسم التطبيق -->
            <h1 id="appName" class="text-2xl font-bold mb-1"></h1>

            <!-- رقم الإصدار -->
            <p id="appVersion" class="text-sm text-zinc-500 font-medium mb-3"></p>

            <!-- شارة الحجم -->
            <span class="size-badge">
                <i class="fas fa-database"></i>
                <span id="appSize"></span>
            </span>

            <!-- زر التحميل -->
            <a id="downloadBtn"
               href="#"
               rel="noreferrer"
               class="download-btn flex items-center justify-center gap-3 px-10 py-4 rounded-md font-bold text-lg w-full max-w-xs sm:w-auto">
                <i class="fab fa-android text-xl"></i>
                تحميل التطبيق
            </a>

        </div>

    </main>

    <!-- ================= التذييل ================= -->
    <footer class="w-full py-8 px-6 flex flex-col items-center gap-6 relative z-10">

        <!-- أيقونات التواصل -->
        <div class="flex gap-6">
            <a id="whatsappLink" href="#" class="social-icon text-2xl" title="واتساب">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a id="instagramLink" href="#" class="social-icon text-2xl" title="إنستغرام">
                <i class="fab fa-instagram"></i>
            </a>
        </div>

        <!-- الحقوق -->
        <p class="text-xs text-zinc-600 font-semibold tracking-wide uppercase">
            POWERED BY ABDULLRAHMAN ABDULLAH
        </p>

    </footer>

    <script>
        /* ============================================================
           روابط التواصل
           ============================================================ */
        const WHATSAPP_URL = "https://wa.me/+963981082693";
        const INSTAGRAM_URL = "https://www.instagram.com/abdullrahman.abdulah";

        document.getElementById('whatsappLink').href = WHATSAPP_URL;
        document.getElementById('instagramLink').href = INSTAGRAM_URL;

        /* ============================================================
           الجزيئات
           ============================================================ */
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.animationDuration = (10 + Math.random() * 15) + 's';
                container.appendChild(p);
            }
        })();

        /* ============================================================
           الحالات
           ============================================================ */
        function showState(id) {
            ['loadingState', 'errorState', 'appState'].forEach(s => {
                document.getElementById(s).classList.add('state-hidden');
            });
            document.getElementById(id).classList.remove('state-hidden');
        }

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            showState('errorState');
        }

        /* ============================================================
           منطق التطبيق
           ============================================================ */
        async function initApp() {
            const params = new URLSearchParams(window.location.search);
            const appKey = (params.get('app') || '').toLowerCase().trim();

            if (!appKey) {
                showError('لم يتم تحديد اسم التطبيق في الرابط (?app=...)');
                document.title = 'التطبيق غير موجود';
                return;
            }

            let apps;
            try {
                const res = await fetch('apps.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('failed to load apps.json');
                apps = await res.json();
            } catch (err) {
                showError('تعذّر تحميل بيانات التطبيقات. حاول لاحقاً.');
                console.error(err);
                return;
            }

            const app = apps[appKey];
            if (!app) {
                showError('تأكد من الرابط أو تواصل معنا');
                document.title = 'التطبيق غير موجود';
                return;
            }

            // تعبئة البيانات
            const iconEl = document.getElementById('appIcon');
            iconEl.src = 'images/' + app.icon;
            iconEl.alt = app.name;

            document.getElementById('appName').textContent = app.name;
            document.getElementById('appVersion').textContent = 'الإصدار ' + app.version;
            document.getElementById('appSize').textContent = app.size;

            document.getElementById('downloadBtn').href = app.download;

            document.title = 'تحميل ' + app.name + ' | الإصدار ' + app.version;

            showState('appState');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>

</body>
</html>
