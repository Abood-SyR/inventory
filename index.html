<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تحميل التطبيقات | Reson </title>
    <meta name="description" content="صفحة تحميل التطبيقات  ">
    <meta property="og:type" content="website">
    <meta property="og:title" content="تحميل التطبيقات | Reson ">
    <meta property="og:description" content="صفحة تحميل التطبيقات  ">
    <meta property="og:image" content="icon.png">
    <meta property="og:site_name" content="Reson">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:type" content="image/png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="تحميل التطبيقات | Reson ">
    <meta name="twitter:description" content="صفحة تحميل التطبيقات  ">
    <meta name="twitter:image" content="icon.png">

    <link id="favicon" rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0a;
            color: #fafafa;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background:
                radial-gradient(circle at 20% 30%, rgba(100, 100, 255, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 255, 0.1) 0%, transparent 35%),
                radial-gradient(circle at 40% 80%, rgba(100, 255, 255, 0.1) 0%, transparent 40%),
                #0a0a0a;
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .bg-animated::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 20px);
            animation: moveGrid 30s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(30px) translateY(30px); }
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            animation: particleFloat 15s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }

        main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            z-index: 10;
            overflow-y: auto;
            overflow-x: hidden;
        }

        main.list-mode {
            justify-content: flex-start;
            padding-top: 32px;
            padding-bottom: 16px;
        }

        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-track { background: transparent; }
        main::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        main::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .download-btn {
            background-color: #ffffff;
            color: #050505;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }

        .download-btn:hover {
            background-color: #e4e4e7;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .social-icon {
            color: #71717a;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .social-icon:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        .state-hidden { display: none !important; }

        .spinner {
            width: 45px; height: 45px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .size-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .app-card {
            background: rgba(20, 20, 20, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 26px 22px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            animation: cardIn 0.5s ease-out backwards;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #3b82f6, transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .app-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px -20px rgba(100, 100, 255, 0.5);
        }

        .app-card:hover::before { opacity: 1; }

        .app-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .card-arrow {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            line-height: 1.2;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        footer {
            flex-shrink: 0;
            width: 100%;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 10;
        }

        @media (max-height: 700px) {
            .size-badge { margin-bottom: 0 !important; }
            #appIcon { width: 80px !important; height: 80px !important; margin-bottom: 16px !important; }
        }

        @media (max-height: 600px) {
            #appName { font-size: 1.1rem !important; }
            #appVersion { margin-bottom: 8px !important; }
            footer { padding: 10px 24px; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-animated"></div>
    <div id="particles"></div>

    <main id="mainContent">

        <div id="loadingState" class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
        </div>

        <div id="errorState" class="state-hidden flex flex-col items-center">
            <h1 class="text-2xl font-bold mb-2">التطبيق غير موجود</h1>
            <p id="errorMessage" class="text-sm text-zinc-500">تأكد من الرابط أو تواصل معنا</p>
        </div>

        <div id="appState" class="state-hidden flex flex-col items-center">

            <img id="appIcon"
                 src=""
                 alt="أيقونة التطبيق"
                 class="w-24 h-24 rounded-2xl mb-6 border border-zinc-800 object-cover shadow-2xl bg-zinc-900">

            <h1 id="appName" class="text-2xl font-bold mb-1"></h1>

            <p id="appVersion" class="text-sm text-zinc-500 font-medium mb-3"></p>

            <span class="size-badge" style="margin-bottom: 28px;">
                <i class="fas fa-database"></i>
                <span id="appSize"></span>
            </span>

            <a id="downloadBtn"
               href="#"
               rel="noreferrer"
               class="download-btn flex items-center justify-center gap-3 px-10 py-4 rounded-md font-bold text-lg w-full max-w-xs sm:w-auto">
                <i class="fab fa-android text-xl"></i>
                تحميل التطبيق
            </a>

        </div>

        <div id="listState" class="state-hidden w-full max-w-5xl">

            <div class="mb-10 text-center">
                <h1 class="page-title mb-2">تطبيقاتي</h1>
                <p class="text-sm text-zinc-500">اختر التطبيق الذي تريد تحميله</p>
            </div>

            <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

            <div id="emptyList" class="state-hidden mt-8 text-center">
                <i class="fas fa-folder-open text-4xl text-zinc-600 mb-3"></i>
                <p class="text-zinc-500 text-sm">لا توجد تطبيقات حالياً</p>
            </div>

        </div>

    </main>

    <footer>
        <div class="flex gap-6">
            <a id="whatsappLink" href="#" class="social-icon text-2xl" title="واتساب">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a id="instagramLink" href="#" class="social-icon text-2xl" title="إنستغرام">
                <i class="fab fa-instagram"></i>
            </a>
        </div>

        <p class="text-xs text-zinc-600 font-semibold tracking-wide uppercase">
            POWERED BY ABDULLRAHMAN ABDULLAH
        </p>
    </footer>

    <script>
        const WHATSAPP_URL = "https://wa.me/+963981082693";
        const INSTAGRAM_URL = "https://www.instagram.com/abdullrahman.abdulah";

        document.getElementById('whatsappLink').href = WHATSAPP_URL;
        document.getElementById('instagramLink').href = INSTAGRAM_URL;

        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.animationDuration = (10 + Math.random() * 15) + 's';
                container.appendChild(p);
            }
        })();

        function setMeta(name, property, content) {
            let el = name
                ? document.querySelector(`meta[name="${name}"]`)
                : document.querySelector(`meta[property="${property}"]`);

            if (!el) {
                el = document.createElement('meta');
                if (name) el.setAttribute('name', name);
                else el.setAttribute('property', property);
                document.head.appendChild(el);
            }
            el.setAttribute('content', content);
        }

        function toAbsoluteUrl(path) {
            try {
                return new URL(path, window.location.href).href;
            } catch (e) {
                return path;
            }
        }

        function updateMeta({ title, description, image }) {
            const absoluteImage = toAbsoluteUrl(image);

            document.title = title;

            setMeta('description', null, description);

            setMeta(null, 'og:title', title);
            setMeta(null, 'og:description', description);
            setMeta(null, 'og:image', absoluteImage);
            setMeta(null, 'og:image:secure_url', absoluteImage);
            setMeta(null, 'og:image:alt', title);
            setMeta(null, 'og:url', window.location.href);

            setMeta('twitter:title', null, title);
            setMeta('twitter:description', null, description);
            setMeta('twitter:image', null, absoluteImage);
            setMeta('twitter:image:alt', null, title);

            document.getElementById('favicon').href = image;
        }

        function showState(id) {
            ['loadingState', 'errorState', 'appState', 'listState'].forEach(s => {
                document.getElementById(s).classList.add('state-hidden');
            });
            document.getElementById(id).classList.remove('state-hidden');

            document.getElementById('mainContent').classList.toggle('list-mode', id === 'listState');
        }

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            showState('errorState');
        }

        async function loadApps() {
            const res = await fetch('apps.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('failed to load apps.json');
            return await res.json();
        }

        function buildAppCard(key, app, index) {
            const a = document.createElement('a');
            a.href = '?app=' + encodeURIComponent(key);
            a.className = 'app-card';
            a.style.animationDelay = (index * 0.08) + 's';

            a.innerHTML = `
                <img src="images/${app.icon}"
                     alt="${app.name}"
                     class="w-20 h-20 rounded-2xl mb-4 border border-zinc-800 object-cover bg-zinc-900 shadow-lg"
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%2280%22 height=%2280%22 rx=%2216%22 fill=%22%2327272a%22/><text x=%2240%22 y=%2248%22 font-size=%2228%22 text-anchor=%22middle%22 fill=%22%2371717a%22 font-family=%22sans-serif%22>?</text></svg>'">

                <h3 class="text-lg font-bold mb-1">${app.name}</h3>
                <p class="text-xs text-zinc-500 mb-3">الإصدار ${app.version}</p>

                <span class="size-badge">
                    <i class="fas fa-database"></i>
                    ${app.size || '—'}
                </span>

                <div class="mt-5 flex items-center gap-2 text-xs font-semibold text-zinc-400 card-arrow">
                    <span>عرض التفاصيل</span>
                    <i class="fas fa-arrow-left"></i>
                </div>
            `;

            return a;
        }

        async function initApp() {
            const params = new URLSearchParams(window.location.search);
            const appKey = (params.get('app') || '').toLowerCase().trim();

            let apps;
            try {
                apps = await loadApps();
            } catch (err) {
                showError('تعذّر تحميل بيانات التطبيقات. حاول لاحقاً.');
                console.error(err);
                return;
            }

            if (!appKey) {
                const entries = Object.entries(apps);

                updateMeta({
                    title: 'التطبيقات | Reson ',
                    description: 'تصفح وحمّل أحدث التطبيقات مباشرة',
                    image: 'icon.png'
                });

                if (entries.length === 0) {
                    showState('listState');
                    document.getElementById('emptyList').classList.remove('state-hidden');
                    return;
                }

                const grid = document.getElementById('appsGrid');
                grid.innerHTML = '';
                entries.forEach(([key, app], i) => {
                    grid.appendChild(buildAppCard(key, app, i));
                });

                showState('listState');
                return;
            }

            const app = apps[appKey];
            if (!app) {
                updateMeta({
                    title: 'التطبيق غير موجود | Reson ',
                    description: 'التطبيق المطلوب غير موجود',
                    image: 'icon.png'
                });
                showError('تأكد من الرابط أو تواصل معنا');
                return;
            }

            const appImageUrl = 'images/' + app.icon;

            updateMeta({
                title: `${app.name} | تحميل الإصدار ${app.version}`,
                description: `تحديث تطبيق ${app.name} — الإصدار ${app.version} — الحجم: ${app.size}`,
                image: appImageUrl
            });

            const iconEl = document.getElementById('appIcon');
            iconEl.src = appImageUrl;
            iconEl.alt = app.name;

            document.getElementById('appName').textContent = app.name;
            document.getElementById('appVersion').textContent = 'الإصدار ' + app.version;
            document.getElementById('appSize').textContent = app.size;

            document.getElementById('downloadBtn').href = app.download;

            showState('appState');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>

</body>
</html>
